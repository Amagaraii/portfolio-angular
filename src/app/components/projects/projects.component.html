<section id="projects" class="py-28">
  <h2 class="text-3xl text-center font-bold mb-6">Mes Projets Perso</h2>
  <!-- Conteneur avec fond gris pour englober les projets -->
  <div class="bg-gray-100 w-4/5 mx-auto rounded-xl shadow-lg p-6">
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let project of projects"
        class="bg-white p-4 rounded-xl shadow-lg transform transition duration-300 hover:scale-105">
        <img [src]="project.image" class="w-full h-52 object-cover rounded-md">
        <h3 class="text-lg font-semibold mt-2">{{ project.title }}</h3>
        <p class="text-gray-600">{{ project.description }}</p>
        <a [href]="project.link" class="text-blue-500 hover:underline">Voir le projet</a>
      </div>
    </div>
  </div>
</section>
